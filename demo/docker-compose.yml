# Demo warehouse: throwaway local Postgres for the DataHub Agent Memory demo.
# Host port 5433 is taken by an unrelated container on this dev machine, and
# DataHub quickstart may also claim 5432, so use 5434 to avoid both.
services:
  postgres:
    image: postgres:16
    container_name: dhmem-demo-postgres
    environment:
      POSTGRES_DB: demo_warehouse
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5434:5432"
    volumes:
      - dhmem-demo-postgres-data:/var/lib/postgresql/data
    networks:
      - dhmem-demo-net

networks:
  dhmem-demo-net:
    name: dhmem-demo-net

volumes:
  dhmem-demo-postgres-data:
    name: dhmem-demo-postgres-data
